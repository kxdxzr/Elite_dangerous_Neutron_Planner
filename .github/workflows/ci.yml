name: Tests and Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/run_tests.py
      - run: python planner.py --smoke-test source-smoke.json
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean EliteDangerousNeutronPlanner.spec
      - shell: pwsh
        run: |
          $process = Start-Process dist/EliteDangerousNeutronPlanner.exe -ArgumentList '--smoke-test', 'exe-smoke.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content exe-smoke.json; exit $process.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: EliteDangerousNeutronPlanner-Windows
          path: |
            dist/EliteDangerousNeutronPlanner.exe
            LICENSE
            source-smoke.json
            exe-smoke.json
